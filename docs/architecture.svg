<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">hanako-bot en ejecución</title>
        <desc id="architecture-desc">Diagrama de arquitectura de hanako-bot: main.js arranca Bot.js, que despacha a los módulos de comandos y de eventos; ambos leen y escriben a través de los repositorios hacia PostgreSQL.</desc>

        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .diagram-container { overflow-x: visible; }</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn before nodes, so lines sit behind boxes) -->
        <line x1="152" y1="200" x2="184" y2="200" stroke="#bf4520" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
        <path d="M 324,190 H 486 Q 494,190 494,182 V 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 324,210 H 486 Q 494,210 494,218 V 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 560,144 H 676 Q 684,144 684,152 V 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 560,276 H 676 Q 684,276 684,268 V 228" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <line x1="752" y1="200" x2="796" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- Arrow labels -->
        <rect x="598" y="124" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="618" y="133" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

        <rect x="758" y="180" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="774" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>

        <!-- Node: main.js (input) -->
        <rect x="32" y="172" width="120" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="172" width="120" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
        <rect x="40" y="178" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="56" y="187" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTRY</text>
        <text x="92" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">main.js</text>
        <text x="92" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">node .</text>

        <!-- Node: Bot.js (focal) -->
        <rect x="184" y="172" width="140" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="184" y="172" width="140" height="56" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
        <rect x="192" y="178" width="28" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="206" y="187" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="254" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bot.js</text>
        <text x="254" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orquestador</text>

        <!-- Node: commands (backend) -->
        <rect x="428" y="116" width="132" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="428" y="116" width="132" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="436" y="122" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="452" y="131" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SLASH</text>
        <text x="494" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">commands</text>
        <text x="494" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/commands/</text>

        <!-- Node: events (backend) -->
        <rect x="428" y="248" width="132" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="428" y="248" width="132" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="436" y="254" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="454" y="263" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENTS</text>
        <text x="494" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">events</text>
        <text x="494" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/events/</text>

        <!-- Node: repositories (backend) -->
        <rect x="616" y="172" width="136" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="616" y="172" width="136" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="624" y="178" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="638" y="187" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="684" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">repositories</text>
        <text x="684" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/database/</text>

        <!-- Node: PostgreSQL (store) -->
        <rect x="796" y="172" width="140" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="796" y="172" width="140" height="56" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="804" y="178" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="820" y="187" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="866" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
        <text x="866" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 tablas</text>

        <!-- Legend strip -->
        <line x1="32" y1="336" x2="968" y2="336" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="32" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

        <rect x="32" y="366" width="14" height="10" rx="2" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
        <text x="52" y="374" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Orquestador</text>

        <rect x="150" y="366" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="170" y="374" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Runtime</text>

        <rect x="256" y="366" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="276" y="374" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Datos</text>

        <rect x="356" y="366" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
        <text x="376" y="374" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entrada</text>

        <line x1="468" y1="371" x2="496" y2="371" stroke="#bf4520" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
        <text x="504" y="374" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Arranque</text>

        <line x1="596" y1="371" x2="624" y2="371" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <text x="632" y="374" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Llamada</text>
      </svg>
